# Disposable process/packaging checks, NOT a product or Supabase deployment.
# No host ports, no user data, no external network. All credentials below are
# test-only. Real PostgreSQL and Redis; explicitly fake Supabase HEALTH only.
x-runtime-env: &runtime-env
  NODE_ENV: production
  PORT: "8080"
  DATABASE_PRIMARY_URL: postgres://postgres:runtime-test@postgres:5432/agsaas_runtime_test?sslmode=disable
  DATABASE_PRIMARY_POOLER_URL: postgres://postgres:runtime-test@postgres:5432/agsaas_runtime_test?sslmode=disable
  SUPABASE_URL: http://auth-health-fixture:8080
  SUPABASE_SECRET_KEY: runtime-test-server-key-not-a-real-credential
  REDIS_URL: redis://redis:6379/14
  REDIS_QUEUE_URL: redis://redis:6379/15
  DB_POOL_STATS_INTERVAL_MS: "0"
  LOG_PRETTY: "false"
  INSIGHTS_ENABLED: "false"

x-runtime: &runtime
  restart: "no"
  networks: [runtime-test]
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy
    auth-health-fixture:
      condition: service_started
  volumes:
    - ./scripts/runtime-smoke.ts:/tmp/agsaas-runtime-smoke.ts:ro

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: agsaas_runtime_test
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: runtime-test
    tmpfs: [/var/lib/postgresql/data]
    networks: [runtime-test]
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U postgres -d agsaas_runtime_test"]
      interval: 2s
      timeout: 5s
      retries: 30
  redis:
    image: redis:7.4-alpine
    command: [redis-server, --save, "", --appendonly, "no"]
    tmpfs: [/data]
    networks: [runtime-test]
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 2s
      timeout: 5s
      retries: 30
  auth-health-fixture:
    image: oven/bun:1.3.11
    command: [bun, /tmp/runtime-supabase-health-fixture.ts]
    environment:
      AGSAAS_RUNTIME_TEST: "1"
    volumes:
      - ./scripts/runtime-supabase-health-fixture.ts:/tmp/runtime-supabase-health-fixture.ts:ro
    networks: [runtime-test]
  api:
    <<: *runtime
    profiles: [api]
    image: agsaas-api:ci
    environment:
      <<: *runtime-env
      ALLOWED_API_ORIGINS: http://localhost:3001
  worker:
    <<: *runtime
    profiles: [worker]
    image: agsaas-worker:ci
    environment: *runtime-env

networks:
  runtime-test:
    internal: true
