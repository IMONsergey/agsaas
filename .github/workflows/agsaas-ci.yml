name: AGSAAS checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: agsaas-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.11"
      - name: Install locked dependencies
        run: bun install --frozen-lockfile
      - name: Lint
        run: bun run lint
      - name: Typecheck workspaces sequentially
        run: bun run typecheck
      - name: Unit regression tests
        run: bun run test:unit
      - name: Verify dashboard build environment and cache contract
        run: bun run test:build-contract
      - name: Build embedded clients and verify MCP output
        run: bun run test:build

  containers:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        app: [api, worker, dashboard]
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.11"
      - name: Build backend from a clean checkout without provider secrets
        if: matrix.app != 'dashboard'
        run: docker build --file apps/${{ matrix.app }}/Dockerfile --build-arg GIT_COMMIT_SHA=${{ github.sha }} --tag agsaas-${{ matrix.app }}:ci .
      - name: Build the actual dashboard standalone image
        if: matrix.app == 'dashboard'
        run: |
          docker build --file apps/dashboard/Dockerfile \
            --build-arg GIT_COMMIT_SHA=${{ github.sha }} \
            --build-arg NEXT_PUBLIC_SUPABASE_URL=http://127.0.0.1:54321 \
            --build-arg NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY=sb_publishable_runtime_test_only \
            --build-arg NEXT_PUBLIC_API_URL=http://127.0.0.1:3003 \
            --build-arg NEXT_PUBLIC_URL=http://127.0.0.1:3001 \
            --build-arg NEXT_SERVER_ACTIONS_ENCRYPTION_KEY="$(openssl rand -base64 32)" \
            --tag agsaas-dashboard:ci .
      - name: Verify embedded MCP assets in the final API image
        if: matrix.app == 'api'
        run: |
          docker run --rm --network none \
            --entrypoint bun agsaas-api:ci \
            test --exit \
            /app/packages/mcp-apps/src/__tests__/build-output.test.ts
      - name: Verify Workbench exports and UI in the final worker image
        if: matrix.app == 'worker'
        run: |
          docker run --rm --network none \
            --entrypoint bun agsaas-worker:ci \
            --eval '
              import { existsSync } from "node:fs";
              import { workbench } from "workbench/hono";

              if (typeof workbench !== "function") {
                throw new Error("Workbench Hono export is unavailable");
              }
              if (!existsSync("/app/packages/workbench/dist/ui/index.html")) {
                throw new Error("Workbench UI build output is unavailable");
              }
            '
      - name: Verify worker admin authentication in the final image
        if: matrix.app == 'worker'
        run: |
          docker run --rm --network none \
            --entrypoint bun agsaas-worker:ci \
            test --exit /app/apps/worker/src/http/admin.test.ts
      - name: Real isolated backend process startup, recovery and shutdown
        if: matrix.app != 'dashboard'
        run: bun scripts/test-runtime-containers.ts ${{ matrix.app }}
      - name: Serve dashboard health and built assets without external networking
        if: matrix.app == 'dashboard'
        run: |
          docker run --rm --network none \
            --mount type=bind,source="${{ github.workspace }}/scripts/smoke-dashboard.ts",target=/tmp/smoke-dashboard.ts,readonly \
            --entrypoint bun agsaas-dashboard:ci \
            /tmp/smoke-dashboard.ts --app-dir /app/apps/dashboard

  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: midday_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d midday_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7.4-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5433/midday_test
      REDIS_TEST_URL: redis://127.0.0.1:6379/15
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.11"
      - name: Install locked dependencies
        run: bun install --frozen-lockfile
      - name: Isolated PostgreSQL calculations and tenant boundaries
        run: bun run test:db
      - name: Real Redis and BullMQ regressions
        run: bun run test:redis
