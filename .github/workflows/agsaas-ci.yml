name: AGSAAS checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: agsaas-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.11"
      - name: Install locked dependencies
        run: bun install --frozen-lockfile
      - name: Lint
        run: bun run lint
      - name: Typecheck workspaces sequentially
        run: bun run typecheck
      - name: Unit regression tests
        run: bun run test:unit
      - name: Build embedded clients and verify MCP output
        run: bun run test:build

  containers:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        app: [api, worker]
    steps:
      - uses: actions/checkout@v4
      - name: Build service from a clean checkout without secrets
        run: docker build --file apps/${{ matrix.app }}/Dockerfile --build-arg GIT_COMMIT_SHA=${{ github.sha }} --tag agsaas-${{ matrix.app }}:ci .
      - name: Verify embedded MCP assets in the final API image
        if: matrix.app == 'api'
        run: |
          docker run --rm --network none \
            --entrypoint bun agsaas-api:ci \
            test --exit \
            /app/packages/mcp-apps/src/__tests__/build-output.test.ts
      - name: Verify Workbench exports and UI in the final worker image
        if: matrix.app == 'worker'
        run: |
          docker run --rm --network none \
            --entrypoint bun agsaas-worker:ci \
            --eval '
              import { existsSync } from "node:fs";
              import { workbench } from "workbench/hono";

              if (typeof workbench !== "function") {
                throw new Error("Workbench Hono export is unavailable");
              }
              if (!existsSync("/app/packages/workbench/dist/ui/index.html")) {
                throw new Error("Workbench UI build output is unavailable");
              }
            '
      - name: Verify worker admin authentication in the final image
        if: matrix.app == 'worker'
        run: |
          docker run --rm --network none \
            --entrypoint bun agsaas-worker:ci \
            test --exit /app/apps/worker/src/http/admin.test.ts

  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: midday_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d midday_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7.4-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5433/midday_test
      REDIS_TEST_URL: redis://127.0.0.1:6379/15
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.11"
      - name: Install locked dependencies
        run: bun install --frozen-lockfile
      - name: Isolated PostgreSQL calculations
        run: bun run test:db
      - name: Real Redis and BullMQ regressions
        run: bun run test:redis
