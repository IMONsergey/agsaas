name: Import Midday snapshot (one-time)
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/bootstrap-midday.yml"
permissions:
  contents: write
jobs:
  import:
    if: github.repository == 'IMONsergey/agsaas'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download pinned upstream commit
        run: |
          git clone --depth 1 https://github.com/midday-ai/midday.git "$RUNNER_TEMP/source"
          test "$(git -C "$RUNNER_TEMP/source" rev-parse HEAD)" = "51587319f26a0ffaa9dfccab1920373cb65689b7"
      - name: Import, preserving all source files and license
        run: |
          rsync -a --exclude='.git' "$RUNNER_TEMP/source/" "$GITHUB_WORKSPACE/"
          test -f LICENSE
          test -f bun.lock
          test -d apps/dashboard
          rm -- .github/workflows/bootstrap-midday.yml
          git add -A
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -m "chore: import Midday source snapshot 51587319"
          git push origin HEAD:main
