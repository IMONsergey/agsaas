    ssl_certificate /opt/agsaas/preview-20261101/control/tls/live/agsaas-preview-ip/fullchain.pem;
    ssl_certificate_key /opt/agsaas/preview-20261101/control/tls/live/agsaas-preview-ip/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    server_tokens off;
    access_log /var/log/nginx/agsaas-candidate-access.log agsaas_candidate;
    error_log /var/log/nginx/agsaas-candidate-error.log warn;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
    add_header X-Frame-Options SAMEORIGIN always;
    client_max_body_size 52m;
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-Host $http_host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-Port 8549;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_read_timeout 60s;
    proxy_send_timeout 60s;
    location ~ ^/storage/v1/(object|render/image)/public/(avatars|apps)/ {
        add_header X-Content-Type-Options nosniff always;
        add_header Content-Security-Policy "sandbox; default-src 'none'; frame-ancestors 'none'" always;
        add_header Referrer-Policy no-referrer always;
        add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
        proxy_pass http://127.0.0.1:14000;
    }
    location ^~ /auth/v1/admin { return 404; }
    location = /auth/v1/invite { return 404; }
    location /auth/v1/ { proxy_pass http://127.0.0.1:14000; }
    location /rest/v1/ { proxy_pass http://127.0.0.1:14000; }
    location /storage/v1/ { proxy_pass http://127.0.0.1:14000; }
    location /functions/v1/ { proxy_pass http://127.0.0.1:14000; }
    location /realtime/v1/ {
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_pass http://127.0.0.1:14000;
    }
    location / { return 404; }
}

