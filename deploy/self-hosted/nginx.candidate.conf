# Explicit isolated candidate, matching immutable build origins.
# Separate host ingress only: no production mounts/keys enter its containers.
# Ports443/8543-8546 remain outside this file. All candidate pages are noindex.
log_format agsaas_candidate '$remote_addr [$time_local] "$request_method $uri $server_protocol" $status $body_bytes_sent';
server {
    listen 94.249.186.240:8547 ssl;
    server_name 94.249.186.240;
    if ($host != 94.249.186.240) { return 444; }
    ssl_certificate /opt/agsaas/preview-20261101/control/tls/live/agsaas-preview-ip/fullchain.pem;
    ssl_certificate_key /opt/agsaas/preview-20261101/control/tls/live/agsaas-preview-ip/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    server_tokens off;
    access_log /var/log/nginx/agsaas-candidate-access.log agsaas_candidate;
    error_log /var/log/nginx/agsaas-candidate-error.log warn;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
    add_header X-Frame-Options SAMEORIGIN always;
    client_max_body_size 52m;
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-Host $http_host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-Port 8547;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_read_timeout 60s;
    proxy_send_timeout 60s;
    location / { proxy_pass http://127.0.0.1:13500; }
}

