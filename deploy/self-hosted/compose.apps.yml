# Third layer: pinned upstream docker-compose.yml, platform.compose.yml, then this file.
# Supply generated Supabase and app settings (one private file or layered env files).
# Do not run this file alone or combine it with either disposable test Compose stack.

x-app-runtime: &app-runtime
  restart: unless-stopped
  init: true
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"

x-app-environment: &app-environment
  NODE_ENV: production
  TZ: UTC
  LOG_PRETTY: "false"
  DB_POOL_STATS_INTERVAL_MS: "60000"
  SUPABASE_URL: "${SUPABASE_PUBLIC_URL:?Set the canonical browser-visible Supabase base URL}"
  NEXT_PUBLIC_SUPABASE_URL: "${SUPABASE_PUBLIC_URL:?Set the canonical browser-visible Supabase base URL}"
  # Server-only transport override. Public SDK URLs/cookie identity stay canonical.
  SUPABASE_INTERNAL_URL: http://api-gw:8000
  NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: "${SUPABASE_PUBLISHABLE_KEY:?Generate the matched publishable key}"
  NEXT_PUBLIC_AUTH_COOKIE_NAME: "${NEXT_PUBLIC_AUTH_COOKIE_NAME:-}"
  SUPABASE_SECRET_KEY: "${SUPABASE_SECRET_KEY:?Generate the matched server key}"
  NEXT_PUBLIC_URL: "${AGSAAS_DASHBOARD_URL:?Set the canonical dashboard URL}"
  NEXT_PUBLIC_API_URL: "${AGSAAS_API_URL:?Set the canonical API URL}"
  # Shared helpers use the same canonical installation URLs.
  DASHBOARD_URL: "${AGSAAS_DASHBOARD_URL:?Set the canonical dashboard URL}"
  API_URL: "${AGSAAS_API_URL:?Set the canonical API URL}"
  MIDDAY_DASHBOARD_URL: "${AGSAAS_DASHBOARD_URL:?Set the canonical dashboard URL}"
  MIDDAY_API_URL: "${AGSAAS_API_URL:?Set the canonical API URL}"
  API_INTERNAL_URL: http://api:8080
  REDIS_URL: "redis://:${REDIS_CACHE_PASSWORD:?Generate the cache password}@redis-cache:6379/0"
  MIDDAY_ENCRYPTION_KEY: "${MIDDAY_ENCRYPTION_KEY:?Generate and retain 32 bytes encoded as 64 hex characters}"
  FILE_KEY_SECRET: "${FILE_KEY_SECRET:?Generate and retain the file signing secret}"
  INVOICE_JWT_SECRET: "${INVOICE_JWT_SECRET:?Generate and retain the invoice signing secret}"

# Server-only optional provider configuration. Missing keys keep sync pending.
x-native-bank-environment: &native-bank-environment
  PLAID_CLIENT_ID: "${PLAID_CLIENT_ID:-}"
  PLAID_SECRET: "${PLAID_SECRET:-}"
  PLAID_ENVIRONMENT: "${PLAID_ENVIRONMENT:-production}"
  TELLER_CERT_BASE64: "${TELLER_CERT_BASE64:-}"
  TELLER_KEY_BASE64: "${TELLER_KEY_BASE64:-}"
  GOCARDLESS_SECRET_ID: "${GOCARDLESS_SECRET_ID:-}"
  GOCARDLESS_SECRET_KEY: "${GOCARDLESS_SECRET_KEY:-}"
  ENABLEBANKING_APPLICATION_ID: "${ENABLEBANKING_APPLICATION_ID:-}"
  ENABLE_BANKING_KEY_CONTENT: "${ENABLE_BANKING_KEY_CONTENT:-}"
  ENABLEBANKING_REDIRECT_URL: "${ENABLEBANKING_REDIRECT_URL:-}"

services:
  api:
    <<: *app-runtime
    image: "agsaas-api:${AGSAAS_RELEASE:?Set the exact application commit}"
    build:
      context: "${AGSAAS_SOURCE_DIR:?Set the absolute AGSaaS checkout path}"
      dockerfile: apps/api/Dockerfile
      args:
        GIT_COMMIT_SHA: "${AGSAAS_RELEASE:?Set the exact application commit}"
    mem_limit: 1024m
    cpus: 1.5
    pids_limit: 256
    stop_grace_period: 20s
    ports:
      - "127.0.0.1:3303:8080/tcp"
    depends_on:
      db:
        condition: service_healthy
      api-gw:
        condition: service_healthy
      redis-cache:
        condition: service_healthy
      redis-queue:
        condition: service_healthy
    environment:
      <<: [*app-environment, *native-bank-environment]
      PORT: "8080"
      DATABASE_PRIMARY_URL: "${AGSAAS_DATABASE_URL:?Provision the dedicated backend database role first}"
      SUPABASE_JWT_SECRET: "${JWT_SECRET:?Use the matching Supabase legacy signing secret}"
      REDIS_QUEUE_URL: "redis://:${REDIS_QUEUE_PASSWORD:?Generate the queue password}@redis-queue:6379/0"
      INTERNAL_API_KEY: "${INTERNAL_API_KEY:?Generate the shared API/worker service credential}"
      AGSAAS_SUPPORT_INGEST_KEY: "${AGSAAS_SUPPORT_INGEST_KEY:-}"
      GMAIL_CLIENT_ID: "${GMAIL_CLIENT_ID:-}"
      GMAIL_CLIENT_SECRET: "${GMAIL_CLIENT_SECRET:-}"
      GMAIL_REDIRECT_URI: "${GMAIL_REDIRECT_URI:-}"
      OUTLOOK_CLIENT_ID: "${OUTLOOK_CLIENT_ID:-}"
      OUTLOOK_CLIENT_SECRET: "${OUTLOOK_CLIENT_SECRET:-}"
      OUTLOOK_REDIRECT_URI: "${OUTLOOK_REDIRECT_URI:-}"
      RESEND_API_KEY: "${RESEND_API_KEY:-}"
      EMAIL_FROM: "${EMAIL_FROM:-}"
      APP_NAME: "${APP_NAME:-AGSaaS}"
      EMAIL_REPLY_TO: "${EMAIL_REPLY_TO:-}"
      EMAIL_REVIEW_TO: "${EMAIL_REVIEW_TO:-}"
      AGSAAS_BILLING_ENABLED: "${AGSAAS_BILLING_ENABLED:-false}"
      POLAR_ACCESS_TOKEN: "${POLAR_ACCESS_TOKEN:-}"
      POLAR_WEBHOOK_SECRET: "${POLAR_WEBHOOK_SECRET:-}"
      POLAR_STARTER_PRODUCT_ID: "${POLAR_STARTER_PRODUCT_ID:-}"
      POLAR_STARTER_YEARLY_PRODUCT_ID: "${POLAR_STARTER_YEARLY_PRODUCT_ID:-}"
      POLAR_PRO_PRODUCT_ID: "${POLAR_PRO_PRODUCT_ID:-}"
      POLAR_PRO_YEARLY_PRODUCT_ID: "${POLAR_PRO_YEARLY_PRODUCT_ID:-}"
      PLAIN_API_KEY: "${PLAIN_API_KEY:-}"
      ALLOWED_API_ORIGINS: "${AGSAAS_DASHBOARD_URL:?Set the exact dashboard origin}"
    healthcheck:
      test:
        - CMD
        - bun
        - --eval
        - "const r = await fetch('http://127.0.0.1:8080/health/ready', { signal: AbortSignal.timeout(5000) }); if (r.status !== 200 || (await r.json()).status !== 'ok') process.exit(1);"
      interval: 15s
      timeout: 8s
      retries: 5
      start_period: 60s

  worker:
    <<: *app-runtime
    image: "agsaas-worker:${AGSAAS_RELEASE:?Set the exact application commit}"
    build:
      context: "${AGSAAS_SOURCE_DIR:?Set the absolute AGSaaS checkout path}"
      dockerfile: apps/worker/Dockerfile
      args:
        GIT_COMMIT_SHA: "${AGSAAS_RELEASE:?Set the exact application commit}"
    mem_limit: 2048m
    cpus: 2.0
    pids_limit: 256
    stop_grace_period: 40s
    # No host port, administration credentials, or Docker socket.
    depends_on:
      api:
        condition: service_healthy
      supavisor:
        condition: service_healthy
      redis-cache:
        condition: service_healthy
      redis-queue:
        condition: service_healthy
    environment:
      <<: [*app-environment, *native-bank-environment]
      PORT: "8080"
      DATABASE_PRIMARY_POOLER_URL: "${AGSAAS_WORKER_DATABASE_URL:?Set the dedicated role and transaction pooler tenant}"
      REDIS_QUEUE_URL: "redis://:${REDIS_QUEUE_PASSWORD:?Generate the queue password}@redis-queue:6379/0"
      INTERNAL_API_KEY: "${INTERNAL_API_KEY:?Generate the shared API/worker service credential}"
      GMAIL_CLIENT_ID: "${GMAIL_CLIENT_ID:-}"
      GMAIL_CLIENT_SECRET: "${GMAIL_CLIENT_SECRET:-}"
      GMAIL_REDIRECT_URI: "${GMAIL_REDIRECT_URI:-}"
      OUTLOOK_CLIENT_ID: "${OUTLOOK_CLIENT_ID:-}"
      OUTLOOK_CLIENT_SECRET: "${OUTLOOK_CLIENT_SECRET:-}"
      OUTLOOK_REDIRECT_URI: "${OUTLOOK_REDIRECT_URI:-}"
      RESEND_API_KEY: "${RESEND_API_KEY:-}"
      EMAIL_FROM: "${EMAIL_FROM:-}"
      APP_NAME: "${APP_NAME:-AGSaaS}"
      EMAIL_REPLY_TO: "${EMAIL_REPLY_TO:-}"
      EMAIL_REVIEW_TO: "${EMAIL_REVIEW_TO:-}"
      WORKER_ENV: "${AGSAAS_WORKER_ENV:-staging}"
      INSIGHTS_ENABLED: "${INSIGHTS_ENABLED:-false}"
    healthcheck:
      test:
        - CMD
        - bun
        - --eval
        - "const r = await fetch('http://127.0.0.1:8080/health/ready', { signal: AbortSignal.timeout(5000) }); if (r.status !== 200 || (await r.json()).status !== 'ok') process.exit(1);"
      interval: 15s
      timeout: 8s
      retries: 5
      start_period: 60s

  dashboard:
    <<: *app-runtime
    image: "agsaas-dashboard:${AGSAAS_RELEASE:?Set the exact application commit}"
    build:
      context: "${AGSAAS_SOURCE_DIR:?Set the absolute AGSaaS checkout path}"
      dockerfile: apps/dashboard/Dockerfile
      args:
        GIT_COMMIT_SHA: "${AGSAAS_RELEASE:?Set the exact application commit}"
        NEXT_PUBLIC_SUPABASE_URL: "${SUPABASE_PUBLIC_URL:?Set the canonical Supabase URL before building}"
        NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: "${SUPABASE_PUBLISHABLE_KEY:?Generate the matched publishable key}"
        NEXT_PUBLIC_AUTH_COOKIE_NAME: "${NEXT_PUBLIC_AUTH_COOKIE_NAME:-}"
        NEXT_PUBLIC_URL: "${AGSAAS_DASHBOARD_URL:?Set the canonical dashboard URL before building}"
        NEXT_PUBLIC_API_URL: "${AGSAAS_API_URL:?Set the canonical API URL before building}"
        NEXT_SERVER_ACTIONS_ENCRYPTION_KEY: "${NEXT_SERVER_ACTIONS_ENCRYPTION_KEY:?Generate and retain a canonical base64-encoded 32-byte key}"
    mem_limit: 1024m
    cpus: 1.0
    pids_limit: 256
    stop_grace_period: 30s
    ports:
      - "127.0.0.1:3300:3000/tcp"
    depends_on:
      api:
        condition: service_healthy
      redis-cache:
        condition: service_healthy
    environment:
      <<: *app-environment
      PORT: "3000"
      HOSTNAME: "0.0.0.0"
      NEXT_SERVER_ACTIONS_ENCRYPTION_KEY: "${NEXT_SERVER_ACTIONS_ENCRYPTION_KEY:?Use the same key as the image build}"
      # Omitted by default: no arbitrary historical signup cutoff for self-hosting.
      NEW_USER_SIGNUP_CUTOFF: "${NEW_USER_SIGNUP_CUTOFF:-}"
      AUTH_ENABLED_PROVIDERS: "${AUTH_ENABLED_PROVIDERS:-email}"
      AUTH_PASSWORD_RECOVERY_ENABLED: "${AUTH_PASSWORD_RECOVERY_ENABLED:-false}"
      PLAIN_API_KEY: "${PLAIN_API_KEY:-}"
      PLAIN_SUPPORT_LABEL_ID: "${PLAIN_SUPPORT_LABEL_ID:-}"
      PLAIN_FEEDBACK_LABEL_ID: "${PLAIN_FEEDBACK_LABEL_ID:-}"
    healthcheck:
      test:
        - CMD
        - bun
        - --eval
        - "const r = await fetch('http://127.0.0.1:3000/api/health', { signal: AbortSignal.timeout(5000) }); if (r.status !== 200 || (await r.json()).status !== 'ok') process.exit(1);"
      interval: 15s
      timeout: 8s
      retries: 5
      start_period: 60s

  redis-cache:
    image: "${AGSAAS_REDIS_IMAGE:?Set and record the approved Redis image reference}"
    restart: unless-stopped
    mem_limit: 384m
    cpus: 0.5
    pids_limit: 64
    command:
      - redis-server
      - --requirepass
      - "${REDIS_CACHE_PASSWORD:?Generate a separate cache password}"
      - --maxmemory
      - 256mb
      - --maxmemory-policy
      - allkeys-lru
      - --save
      - ""
      - --appendonly
      - "no"
    environment:
      REDISCLI_AUTH: "${REDIS_CACHE_PASSWORD:?Generate a separate cache password}"
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 10s
      timeout: 5s
      retries: 5
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  redis-queue:
    image: "${AGSAAS_REDIS_IMAGE:?Set and record the approved Redis image reference}"
    restart: unless-stopped
    mem_limit: 768m
    cpus: 1.0
    pids_limit: 64
    stop_grace_period: 30s
    command:
      - redis-server
      - --requirepass
      - "${REDIS_QUEUE_PASSWORD:?Generate a separate queue password}"
      - --maxmemory
      - 512mb
      - --maxmemory-policy
      - noeviction
      - --appendonly
      - "yes"
      - --appendfsync
      - everysec
    environment:
      REDISCLI_AUTH: "${REDIS_QUEUE_PASSWORD:?Generate a separate queue password}"
    volumes:
      - redis-queue-data:/data
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 10s
      timeout: 5s
      retries: 5
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  redis-queue-data:
