# AGSaaS isolated public preview. Do not bind the VPN port 443.
map $http_upgrade $agsaas_connection_upgrade { default upgrade; '' close; }
log_format agsaas_preview '$remote_addr [$time_local] "$request_method $uri $server_protocol" $status $body_bytes_sent';
server {
    listen 94.249.186.240:8543 ssl;
    server_name 94.249.186.240;
    if ($host != 94.249.186.240) { return 444; }
    ssl_certificate /opt/agsaas/preview-20261101/control/tls/live/agsaas-preview-ip/fullchain.pem;
    ssl_certificate_key /opt/agsaas/preview-20261101/control/tls/live/agsaas-preview-ip/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    server_tokens off;
    access_log /var/log/nginx/agsaas-preview-access.log agsaas_preview;
    error_log /var/log/nginx/agsaas-preview-error.log warn;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    client_max_body_size 50m;
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-Host $http_host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $agsaas_connection_upgrade;
    proxy_read_timeout 300s;
    proxy_send_timeout 60s;
    proxy_buffering off;
    proxy_set_header X-Forwarded-Port 8543;
    location / { proxy_pass http://127.0.0.1:3500; }
}
server {
    listen 94.249.186.240:8544 ssl;
    server_name 94.249.186.240;
    if ($host != 94.249.186.240) { return 444; }
    ssl_certificate /opt/agsaas/preview-20261101/control/tls/live/agsaas-preview-ip/fullchain.pem;
    ssl_certificate_key /opt/agsaas/preview-20261101/control/tls/live/agsaas-preview-ip/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    server_tokens off;
    access_log /var/log/nginx/agsaas-preview-access.log agsaas_preview;
    error_log /var/log/nginx/agsaas-preview-error.log warn;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    client_max_body_size 50m;
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-Host $http_host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $agsaas_connection_upgrade;
    proxy_read_timeout 300s;
    proxy_send_timeout 60s;
    proxy_buffering off;
    proxy_set_header X-Forwarded-Port 8544;
    location / { proxy_pass http://127.0.0.1:3503; }
}
server {
    listen 94.249.186.240:8545 ssl;
    server_name 94.249.186.240;
    if ($host != 94.249.186.240) { return 444; }
    ssl_certificate /opt/agsaas/preview-20261101/control/tls/live/agsaas-preview-ip/fullchain.pem;
    ssl_certificate_key /opt/agsaas/preview-20261101/control/tls/live/agsaas-preview-ip/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    server_tokens off;
    access_log /var/log/nginx/agsaas-preview-access.log agsaas_preview;
    error_log /var/log/nginx/agsaas-preview-error.log warn;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    client_max_body_size 50m;
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-Host $http_host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $agsaas_connection_upgrade;
    proxy_read_timeout 300s;
    proxy_send_timeout 60s;
    proxy_buffering off;
    proxy_set_header X-Forwarded-Port 8545;
    location ^~ /auth/v1/admin { return 404; }
    location = /auth/v1/invite { return 404; }
    location /auth/v1/ { proxy_pass http://127.0.0.1:4000; }
    location /rest/v1/ { proxy_pass http://127.0.0.1:4000; }
    location ~ ^/storage/v1/(object|render/image)/public/(avatars|apps)/ {
        add_header X-Content-Type-Options nosniff always;
        add_header Content-Security-Policy "sandbox; default-src 'none'; frame-ancestors 'none'" always;
        add_header Referrer-Policy no-referrer always;
        add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
        proxy_pass http://127.0.0.1:4000;
    }
    location /storage/v1/ { proxy_pass http://127.0.0.1:4000; }
    location /realtime/v1/ { proxy_pass http://127.0.0.1:4000; }
    location /functions/v1/ { proxy_pass http://127.0.0.1:4000; }
    location / { return 404; }
}
