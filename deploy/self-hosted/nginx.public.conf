# Provisional OWN origin; no DNS invention and no port 443/VPN change.
# Install alongside the reviewed preview vhosts after local website health passes.
log_format agsaas_website '$remote_addr [$time_local] "$request_method $uri $server_protocol" $status $body_bytes_sent';
server {
    listen 94.249.186.240:8546 ssl;
    server_name 94.249.186.240;
    if ($host != 94.249.186.240) { return 444; }
    ssl_certificate /opt/agsaas/preview-20261101/control/tls/live/agsaas-preview-ip/fullchain.pem;
    ssl_certificate_key /opt/agsaas/preview-20261101/control/tls/live/agsaas-preview-ip/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    server_tokens off;
    access_log /var/log/nginx/agsaas-website-access.log agsaas_website;
    error_log /var/log/nginx/agsaas-website-error.log warn;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header X-Frame-Options DENY always;
    # Preview stays excluded from indexing until product/provider acceptance.
    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self'; upgrade-insecure-requests" always;
    # HSTS has no browser persistence for an IP literal. Enable it on the future
    # separately routed hostname only after HTTPS/domain acceptance.
    client_max_body_size 2m;
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-Host $http_host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-Port 8546;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_read_timeout 60s;
    proxy_send_timeout 30s;
    location / { proxy_pass http://127.0.0.1:3501; }
}
