# Optional drop-in for agsaas-preview-certificate.service after release review.
# Preserve the existing isolated Certbot state, profile and six-hour timer.
# Add 8546 only after the own website endpoint has passed live acceptance.
[Service]
ExecStart=
ExecStart=/opt/agsaas/tools/certbot-ip-5.4.0/bin/certbot renew --cert-name agsaas-preview-ip --config-dir /opt/agsaas/preview-20261101/control/tls --work-dir /opt/agsaas/preview-20261101/control/tls-work --logs-dir /opt/agsaas/preview-20261101/control/tls-logs --quiet --deploy-hook "/usr/bin/python3 /opt/agsaas/preview-20261101/source/scripts/self-hosted-tls-check.py reload --ports 8543,8544,8545 --receipt /opt/agsaas/preview-20261101/control/tls-renewal-receipt.json"
